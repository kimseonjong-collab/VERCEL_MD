<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563EB">
  <meta name="description" content="PG주간업무 웹앱 실행 페이지">
  <title>PG주간업무</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eff6ff;
      color: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(160deg, #eff6ff 0%, #dbeafe 100%);
    }

    main {
      width: min(100%, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 36px 24px;
      border: 1px solid rgba(37, 99, 235, 0.15);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 50px rgba(30, 64, 175, 0.14);
      text-align: center;
    }

    img {
      width: 144px;
      height: 144px;
      border-radius: 30px;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: -0.03em;
    }

    a {
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      background: #2563eb;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
    }

    a:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="PG주간업무 아이콘" width="144" height="144">
    <h1>PG주간업무</h1>
    <a href="https://script.google.com/macros/s/AKfycbwiv1JoCKIFonwSg0HhdP1NX1zl2RjkIF55JlCjvsbeRidpN2IOt1telQl-Kpm7MuPE/exec">PG주간업무 열기</a>
  </main>
</body>
</html>
